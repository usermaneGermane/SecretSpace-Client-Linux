name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # The python3 of Ubuntu 22.04 (3.10) and 24.04 (3.12), and the newest.
    runs-on: ubuntu-latest
    # A stuck apt mirror once held a job for over ten minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Every source module imports
        run: python -c "import sys; sys.path.insert(0, 'sourceFiles'); import gui"
      - name: Run the tests
        run: xvfb-run -a python -m pytest -q

  smoke:
    # The real app on a virtual display: unlock, copy, clear, screenshots.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Tk, a virtual display and fonts
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb fonts-dejavu-core imagemagick
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the app
        run: xvfb-run -a -s "-screen 0 1280x800x24" python tools/smoke_gui.py smoke-out
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: smoke-out/

  deb:
    # Build the .deb, install it with apt as a user would, run it with the
    # system's own Python libraries, then remove it.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: >
          sudo apt-get update && sudo apt-get install -y
          python3-pip python3-pytest xvfb imagemagick desktop-file-utils
      - name: Build the package
        run: python3 deb/build_deb.py
      - name: Install the last passman package (from before the rename)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.9.0 -R "$GITHUB_REPOSITORY" -p 'passman_*_all.deb' -D old
          sudo apt-get install -y ./old/passman_0.9.0_all.deb
          dpkg -s passman
          mkdir -p ~/.local/share/passman/vault
          echo kept > ~/.local/share/passman/vault/alice.vault.enc
      - name: Install it with apt - an upgrade that replaces passman
        run: sudo apt-get install -y ./build/secretspace_*_all.deb
      - name: The passman package is gone, its user's vaults are not
        run: |
          if dpkg-query -W -f='${Status}' passman 2>/dev/null | grep -q "install ok installed"; then
            echo "passman is still installed"; exit 1; fi
          test ! -e /usr/lib/passman
          test ! -e /usr/bin/passman
          grep -qx kept ~/.local/share/passman/vault/alice.vault.enc
          # At its first start the app gives the data folder its current
          # name: renamed, with the vault in it, and no second copy.
          /usr/bin/python3 -I -c "import sys; sys.path.insert(0, '/usr/lib/secretspace/sourceFiles'); sys.path.insert(0, '/usr/lib/secretspace/lib'); import vault, os; print(vault.settle_home()); h = vault.get_home_dir(); print(h); assert h == os.path.expanduser('~/.local/share/secretspace'), h"
          grep -qx kept ~/.local/share/secretspace/vault/alice.vault.enc
          test ! -e ~/.local/share/passman
          rm -r ~/.local/share/secretspace   # the steps below check a fresh install
      - name: Check what was installed
        run: |
          dpkg -s secretspace
          dpkg -L secretspace
          test -f /usr/lib/secretspace/installed
          test -x /usr/bin/secretspace
          desktop-file-validate /usr/share/applications/secretspace.desktop
          ls /usr/lib/secretspace/sourceFiles/__pycache__   # compiled by postinst
      - name: The tests, on the system's Python, Tk, cryptography and Pillow
        run: PYTHONPATH=/usr/lib/secretspace/lib xvfb-run -a /usr/bin/python3 -m pytest -q
      - name: Run the installed app
        run: xvfb-run -a -s "-screen 0 1280x800x24" /usr/bin/python3 -I tools/smoke_gui.py smoke-out --installed
      - name: Start it the way the menu does
        run: |
          set +e
          timeout 15 xvfb-run -a secretspace
          code=$?
          [ "$code" -eq 124 ] || { echo "secretspace exited after less than 15 s (code $code)"; exit 1; }
      - name: Remove it
        run: |
          sudo apt-get remove -y secretspace
          if [ -e /usr/lib/secretspace ]; then find /usr/lib/secretspace; exit 1; fi
          test ! -e /usr/bin/secretspace
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-deb-${{ matrix.os }}
          path: smoke-out/
      - name: Keep the package
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: secretspace-deb
          path: build/*.deb
