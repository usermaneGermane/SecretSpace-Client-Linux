name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # The python3 of Ubuntu 22.04 (3.10) and 24.04 (3.12), and the newest.
    runs-on: ubuntu-latest
    # A stuck apt mirror once held a job for over ten minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Every source module imports
        run: python -c "import sys; sys.path.insert(0, 'sourceFiles'); import gui"
      - name: Run the tests
        run: xvfb-run -a python -m pytest -q

  smoke:
    # The real app on a virtual display: unlock, copy, clear, screenshots.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Tk, a virtual display and fonts
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb fonts-dejavu-core imagemagick
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the app
        run: xvfb-run -a -s "-screen 0 1280x800x24" python tools/smoke_gui.py smoke-out
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: smoke-out/

  deb:
    # Build the .deb, install it with apt as a user would, run it with the
    # system's own Python libraries, then remove it.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: >
          sudo apt-get update && sudo apt-get install -y
          python3-pip python3-pytest xvfb imagemagick desktop-file-utils
      - name: Build the package
        run: python3 deb/build_deb.py
      - name: Install it with apt
        run: sudo apt-get install -y ./build/passman_*_all.deb
      - name: Check what was installed
        run: |
          dpkg -s passman
          dpkg -L passman
          test -f /usr/lib/passman/installed
          test -x /usr/bin/passman
          desktop-file-validate /usr/share/applications/passman.desktop
          ls /usr/lib/passman/sourceFiles/__pycache__   # compiled by postinst
      - name: The tests, on the system's Python, Tk, cryptography and Pillow
        run: PYTHONPATH=/usr/lib/passman/lib xvfb-run -a /usr/bin/python3 -m pytest -q
      - name: Run the installed app
        run: xvfb-run -a -s "-screen 0 1280x800x24" /usr/bin/python3 -I tools/smoke_gui.py smoke-out --installed
      - name: Start it the way the menu does
        run: |
          set +e
          timeout 15 xvfb-run -a passman
          code=$?
          [ "$code" -eq 124 ] || { echo "passman exited after less than 15 s (code $code)"; exit 1; }
      - name: Remove it
        run: |
          sudo apt-get remove -y passman
          if [ -e /usr/lib/passman ]; then find /usr/lib/passman; exit 1; fi
          test ! -e /usr/bin/passman
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-deb-${{ matrix.os }}
          path: smoke-out/
      - name: Keep the package
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: passman-deb
          path: build/*.deb
