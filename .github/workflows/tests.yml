name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # The python3 of Ubuntu 22.04 (3.10) and 24.04 (3.12), and the newest.
    runs-on: ubuntu-latest
    # A stuck apt mirror once held a job for over ten minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Every source module imports
        run: python -c "import sys; sys.path.insert(0, 'sourceFiles'); import gui"
      - name: Run the tests
        run: xvfb-run -a python -m pytest -q

  smoke:
    # The real app on a virtual display: unlock, copy, clear, screenshots.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Tk, a virtual display and fonts
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb fonts-dejavu-core imagemagick
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the app
        run: xvfb-run -a -s "-screen 0 1280x800x24" python tools/smoke_gui.py smoke-out
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: smoke-out/
